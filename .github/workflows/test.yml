name: Test

# The one definition of what "the code is in good shape" means.
# Pull requests run it, and the release calls it through workflow_call,
# so a tag cannot enforce a different bar than the PR that was merged.
#
# Pushes to main are covered too: a PR is tested against its own merge
# commit, which is not what ends up on the branch after other PRs land.
#
# What sets the bar is pinned: the actions to commits, and
# golangci-lint and zizmor to versions.  A tag is then held
# to the bar its pull request met.  Dependabot moves the actions;
# the linters move in a pull request of their own.
#
# A check that looks up advisories stays out of this file: it would raise
# the bar every time one is published, whatever the pull request met.
# audit.yml runs those, and the release does not wait for it.
on:
  pull_request:
  push:
    branches:
      - main
  # Called by the release workflow, which gates the build on these jobs.
  workflow_call:

permissions:
  contents: read

# A new push to a pull request makes the previous run's answer stale,
# so drop it.  Runs on main are kept: each one reports its own commit,
# and so are release runs, which must not cancel a half-finished build.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # gofmt is cheap and its output is unambiguous, so it is worth saying
  # plainly which files are unformatted rather than leaving it to review.
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check gofmt
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files need gofmt:"
            printf '%s\n' "$unformatted"
            exit 1
          fi

  # Font enumeration is per-platform and build-tagged, so the tests
  # have to run on each platform the release ships a binary for --
  # that code compiles everywhere and works in one place.
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform, rather than letting the first failure
      # hide what the others would have said.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Called directly rather than through `make vet` and `make test`:
      # the makefile wants a POSIX shell, which the Windows runner does
      # not give it by default.  The targets run the same two commands.
      - run: go vet ./...
      - run: go test ./...

  # golangci-lint carries gosec, which reads the code for calls that are
  # risky on untrusted input, and zizmor reads the workflows.  Both are in
  # `make lint`, so a run here and a run at a desk check the same things.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # The test matrix runs each platform's code, but vet only inspects
      # the files its own GOOS selects, so point it at each one in turn.
      - run: GOOS=linux go vet ./...
      - run: GOOS=darwin go vet ./...
      - run: GOOS=windows go vet ./...
      # Pinned: an unpinned linter turns a new upstream check
      # into a release that cannot be cut.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.3
      - name: Install zizmor
        run: pipx install zizmor==1.31.1
      - run: make lint
